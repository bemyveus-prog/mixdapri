name: Achado do dia

on:
  schedule:
    # 3 carrosséis por dia (horário de Brasília, o GitHub costuma atrasar ~30 min):
    # 09:17, 14:17 e 19:17. Os Reels saem em horários intercalados (workflow Reels v2).
    - cron: "17 12,17,22 * * *"
  workflow_dispatch:
    inputs:
      sem_vitrine:
        description: "Só gerar o carrossel, sem gravar na vitrine (ignorado se marcar Postar)"
        type: boolean
        default: true
      postar:
        description: "Postar no Instagram/Facebook (conforme a variável POSTAR)"
        type: boolean
        default: false

concurrency:
  group: achado-do-dia
  cancel-in-progress: false

env:
  MARCA: ${{ vars.MARCA }}
  MARCA_DAGUA: ${{ vars.MARCA_DAGUA }}

jobs:
  achado:
    if: github.event_name != 'schedule' || github.repository == 'bemyveus-prog/achadinhos' || vars.AGENDA == 'ligada'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: automacao
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: automacao/package-lock.json

      - name: Instalar
        run: |
          npm ci
          bash "$GITHUB_WORKSPACE/.github/prepara-render.sh"

      - name: Escolher produto, publicar na vitrine e gerar carrossel
        # Postar exige o produto na vitrine, então "postar" ignora "só gerar o carrossel"
        run: node achado-do-dia.mjs ${{ inputs.sem_vitrine && !inputs.postar && '--sem-vitrine' || '' }} ${{ github.event_name == 'workflow_dispatch' && !inputs.postar && '--nao-postar' || '' }}
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          # instagram,facebook (vazio = não posta)
          POSTAR: ${{ vars.POSTAR }}
          # Ajustes opcionais em Settings > Secrets and variables > Actions > Variables
          SHOPEE_SUB_ID: ${{ vars.SHOPEE_SUB_ID }}
          INSTAGRAM_HANDLE: ${{ vars.INSTAGRAM_HANDLE }}
          ESTILO: ${{ vars.ESTILO }}
          PALAVRAS_CHAVE: ${{ vars.PALAVRAS_CHAVE }}
          PALAVRAS_BLOQUEADAS: ${{ vars.PALAVRAS_BLOQUEADAS }}
          MIN_COMISSAO: ${{ vars.MIN_COMISSAO }}
          MIN_NOTA: ${{ vars.MIN_NOTA }}
          MIN_VENDAS: ${{ vars.MIN_VENDAS }}
          PRECO_MIN: ${{ vars.PRECO_MIN }}
          PRECO_MAX: ${{ vars.PRECO_MAX }}
          FIXAR_NO_TOPO: ${{ vars.FIXAR_NO_TOPO }}
          # dias que o achado fica na vitrine (depois some sozinho; 0 = não some)
          DIAS_NA_VITRINE: ${{ vars.DIAS_NA_VITRINE }}
          CAPA_FOTO: ${{ vars.CAPA_FOTO }}

      - name: Guardar o carrossel para download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carrossel-${{ github.run_number }}
          path: automacao/saida/
          retention-days: 14
          if-no-files-found: ignore
