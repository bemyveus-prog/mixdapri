name: Reels do achado

# Gera o Reels (vídeo vertical) de um produto da vitrine, com a foto real e narração.
# Gera o vídeo para baixar (Artifacts) e, se marcar "Postar", publica no Instagram.
on:
  workflow_dispatch:
    inputs:
      oferta:
        description: "Número da oferta na vitrine (vazio = achado do dia mais recente)"
        type: string
        default: ""
      postar:
        description: "Postar o Reels no Instagram"
        type: boolean
        default: false

env:
  MARCA: ${{ vars.MARCA }}
  MARCA_DAGUA: ${{ vars.MARCA_DAGUA }}

jobs:
  reels:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: automacao
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: automacao/package-lock.json

      - name: Instalar
        run: |
          npm ci
          bash "$GITHUB_WORKSPACE/.github/prepara-render.sh"

      - name: Gerar o Reels
        run: node reels.mjs ${{ inputs.oferta && format('--oferta {0}', inputs.oferta) || '' }} ${{ inputs.postar && '--postar' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YOUTUBE_POSTAR: ${{ vars.YOUTUBE_POSTAR }}
          YOUTUBE_PRIVACIDADE: ${{ vars.YOUTUBE_PRIVACIDADE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Voz da Fish Audio (opcional). Sem ela, usa a voz neural da Microsoft (grátis).
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_VOICE_ID: ${{ vars.FISH_VOICE_ID }}
          EDGE_VOICE: ${{ vars.EDGE_VOICE }}
          INSTAGRAM_HANDLE: ${{ vars.INSTAGRAM_HANDLE }}
          # Trilha de fundo (opcional): link de um mp3 sem direitos autorais
          MUSICA: ${{ vars.MUSICA }}

      - name: Guardar o Reels para download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reels-${{ github.run_number }}
          path: automacao/saida/reels/
          retention-days: 14
          if-no-files-found: ignore
