name: Reels Top N

# Disparado pelo bot (/top). O roteiro vem em JSON (título + produtos da vitrine + narração de cada um).
on:
  push:
    branches: [top-teste]
  schedule:
    # Top automático todo dia (~13h07 Brasília): a IA escolhe tema e produtos; chega no Telegram para aprovar
    - cron: "7 16 * * *"
  workflow_dispatch:
    inputs:
      roteiro:
        description: 'JSON: {"title":"...","items":[{"id":136,"sku":"","fala":"..."}],"postar":false} (vazio = automático)'
        default: ""

concurrency:
  group: reels-top
  cancel-in-progress: false

env:
  MARCA: ${{ vars.MARCA }}
  MARCA_DAGUA: ${{ vars.MARCA_DAGUA }}

jobs:
  top:
    if: github.event_name != 'schedule' || github.repository == 'bemyveus-prog/achadinhos' || vars.AGENDA == 'ligada'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: automacao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: automacao/package-lock.json
      - name: Instalar
        run: |
          npm ci
          bash "$GITHUB_WORKSPACE/.github/prepara-render.sh"
      - name: Gerar o Reels
        run: node top.mjs ${{ (github.event_name != 'workflow_dispatch' || !inputs.roteiro) && '--auto' || '' }}
        env:
          REELS_TOP: ${{ inputs.roteiro }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YOUTUBE_POSTAR: ${{ vars.YOUTUBE_POSTAR }}
          YOUTUBE_PRIVACIDADE: ${{ vars.YOUTUBE_PRIVACIDADE }}
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL_NARRACAO: ${{ vars.ANTHROPIC_MODEL_NARRACAO }}
          ANTHROPIC_MODEL_TOP: ${{ vars.ANTHROPIC_MODEL_TOP }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          FISH_VOICE_ID: ${{ vars.FISH_VOICE_ID }}
          EDGE_VOICE: ${{ vars.EDGE_VOICE }}
          INSTAGRAM_HANDLE: ${{ vars.INSTAGRAM_HANDLE }}
